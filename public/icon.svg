<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- מדרג צבעים עדין לרקע העגול -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F5" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>

    <!-- מדרג צבעים מוזהב ועשיר לקרואסון -->
    <linearGradient id="croissantGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- הצללת קיפולים -->
    <linearGradient id="foldShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.4" />
    </linearGradient>

    <!-- צל רך מתחת לקרואסון -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#78350F" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- עיגול רקע מלטף -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" stroke="#FBCFE8" stroke-width="4" />

  <!-- קבוצת הקרואסון - מסובבת באלכסון (25- מעלות) -->
  <g transform="translate(256, 256) rotate(-25) translate(-256, -256)" filter="url(#dropShadow)">
    
    <!-- קצה שמאל -->
    <path d="M 70 330 C 50 310 45 270 80 250 C 110 235 150 250 145 295 C 140 330 90 345 70 330 Z" fill="url(#croissantGold)" />
    
    <!-- קצה ימין -->
    <path d="M 442 330 C 462 310 467 270 432 250 C 402 235 362 250 367 295 C 372 330 422 345 442 330 Z" fill="url(#croissantGold)" />

    <!-- זרוע שמאל -->
    <path d="M 110 260 C 120 180 180 150 210 160 C 230 220 200 320 130 310 C 110 295 105 275 110 260 Z" fill="url(#croissantGold)" />
    <path d="M 110 260 C 120 180 180 150 210 160 C 230 220 200 320 130 310 Z" fill="url(#foldShade)" />

    <!-- זרוע ימין -->
    <path d="M 402 260 C 392 180 332 150 302 160 C 282 220 312 320 382 310 C 402 295 407 275 402 260 Z" fill="url(#croissantGold)" />
    <path d="M 402 260 C 392 180 332 150 302 160 C 282 220 312 320 382 310 Z" fill="url(#foldShade)" />

    <!-- מרכז הקרואסון -->
    <path d="M 185 150 C 220 110 292 110 327 150 C 350 220 325 340 256 350 C 187 340 162 220 185 150 Z" fill="url(#croissantGold)" />

    <!-- הקיפול המרכזי הבולט בחזית -->
    <path d="M 210 150 C 235 130 277 130 302 150 C 320 200 295 320 256 335 C 217 320 192 200 210 150 Z" fill="url(#croissantGold)" />
    <path d="M 210 150 C 235 130 277 130 302 150 C 320 200 295 320 256 335 Z" fill="url(#foldShade)" />

    <!-- ברק חמאה מוזהב -->
    <path d="M 230 155 C 245 145 267 145 282 155 C 290 190 275 250 256 265 C 237 250 222 190 230 155 Z" fill="#FEF08A" opacity="0.65" />

    <!-- ניצוצות קטנים למראה חם וטרי -->
    <path d="M 170 100 L 170 85 M 170 85 L 165 92 M 170 85 L 175 92" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />
    <circle cx="330" cy="110" r="3" fill="#F59E0B" opacity="0.7" />
    <circle cx="345" cy="125" r="2" fill="#D97706" opacity="0.6" />
  </g>
</svg>
